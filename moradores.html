<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moradores - Residencial Jaborandi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <i class="fa-solid fa-building-shield logo-icon"></i>
                </div>
                <h3>Residencial Jaborandi</h3>
                <span class="sub-logo">Jangurussu</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a></li>
                <li class="active"><a href="moradores.html"><i class="fa-solid fa-users"></i> <span>Moradores</span></a></li>
                <li><a href="visitantes.html"><i class="fa-solid fa-id-card"></i> <span>Visitantes</span></a></li>
                <li><a href="encomendas.html"><i class="fa-solid fa-box"></i> <span>Encomendas</span></a></li>
                <li><a href="avisos.html"><i class="fa-solid fa-bullhorn"></i> <span>Avisos</span></a></li>
                <li><a href="admin.html"><i class="fa-solid fa-lock"></i> <span>Admin</span></a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="btn-theme"><i class="fa-solid fa-moon"></i> <span>Alternar Tema</span></button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-header">
                <button id="mobile-toggle" class="mobile-toggle"><i class="fa-solid fa-bars"></i></button>
                <h2>Consulta de Moradores</h2>
            </header>

            <div class="content-body">
                <section class="card select-section">
                    <h3><i class="fa-solid fa-filter"></i> Seleção de Localização</h3>
                    <div class="filter-group-row">
                        <div class="form-control-item">
                            <label for="select-bloco">Bloco</label>
                            <select id="select-bloco">
                                <option value="">Selecione o Bloco</option>
                            </select>
                        </div>
                        <div class="form-control-item">
                            <label for="select-apto">Apartamento</label>
                            <select id="select-apto" disabled>
                                <option value="">Selecione primeiro o Bloco</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section id="morador-display" class="card display-section hidden">
                    <div class="display-header">
                        <i class="fa-solid fa-house-user display-avatar-icon"></i>
                        <div>
                            <h3 id="display-localizacao">Bloco X - Apartamento Y</h3>
                            <p class="text-muted">Lista de contatos autorizados para comunicação imediata</p>
                        </div>
                    </div>
                    <hr class="divider">
                    <div id="contatos-container" class="contatos-grid">
                        </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/moradores.js"></script>
    <script>
        // Código para alternância de tema no escopo local da view
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i> <span>Tema Claro</span>' : '<i class="fa-solid fa-moon"></i> <span>Tema Escuro</span>';
        });
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Tema Claro</span>';
        }
        document.getElementById('mobile-toggle').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('open');
        });
    </script>
</body>
</html>
