<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos - Residencial Jaborandi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <i class="fa-solid fa-building-shield logo-icon"></i>
                </div>
                <h3>Residencial Jaborandi</h3>
                <span class="sub-logo">Jangurussu</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a></li>
                <li><a href="moradores.html"><i class="fa-solid fa-users"></i> <span>Moradores</span></a></li>
                <li><a href="visitantes.html"><i class="fa-solid fa-id-card"></i> <span>Visitantes</span></a></li>
                <li><a href="encomendas.html"><i class="fa-solid fa-box"></i> <span>Encomendas</span></a></li>
                <li class="active"><a href="avisos.html"><i class="fa-solid fa-bullhorn"></i> <span>Avisos</span></a></li>
                <li><a href="admin.html"><i class="fa-solid fa-lock"></i> <span>Admin</span></a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="btn-theme"><i class="fa-solid fa-moon"></i> <span>Alternar Tema</span></button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-header">
                <button id="mobile-toggle" class="mobile-toggle"><i class="fa-solid fa-bars"></i></button>
                <h2>Mural Eletrônico de Avisos</h2>
            </header>

            <div class="content-body">
                <div class="dashboard-flex-row">
                    <section class="card standard-form-card">
                        <h3 id="form-aviso-title"><i class="fa-solid fa-pen-to-square"></i> Fixar Novo Comunicado</h3>
                        <form id="form-aviso">
                            <input type="hidden" id="aviso-id">
                            <div class="form-group">
                                <label for="aviso-titulo">Título do Comunicado</label>
                                <input type="text" id="aviso-titulo" required placeholder="Ex: Manutenção da bomba d'água">
                            </div>
                            <div class="form-group">
                                <label for="aviso-data">Data de Publicação</label>
                                <input type="date" id="aviso-data" required>
                            </div>
                            <div class="form-group">
                                <label for="aviso-msg">Mensagem Detalhada</label>
                                <textarea id="aviso-msg" rows="5" required placeholder="Escreva o texto informativo aqui..."></textarea>
                            </div>
                            <div class="btn-group-row">
                                <button type="submit" class="btn-submit"><i class="fa-solid fa-thumbtack"></i> Publicar no Mural</button>
                                <button type="button" id="btn-cancel-aviso" class="btn-cancel hidden">Cancelar Edição</button>
                            </div>
                        </form>
                    </section>

                    <section class="card standard-list-card">
                        <h3><i class="fa-solid fa-clipboard-list"></i> Avisos Fixados Ativos</h3>
                        <div id="mural-container" class="mural-grid-view">
                            </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="js/avisos.js"></script>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i> <span>Tema Claro</span>' : '<i class="fa-solid fa-moon"></i> <span>Tema Escuro</span>';
        });
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Tema Claro</span>';
        }
        document.getElementById('mobile-toggle').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('open');
        });
    </script>
</body>
</html>
